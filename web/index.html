<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Recap English to Myanmar</title>
  <style>
    body{font:16px system-ui,sans-serif;max-width:760px;margin:40px auto;padding:0 18px;background:#0d0f14;color:#e7eaf0}
    main{background:#151922;border:1px solid #303744;border-radius:12px;padding:24px}
    label{display:block;margin:16px 0 6px;color:#9da7b6}
    input,button{font:inherit;padding:10px;border-radius:7px;border:1px solid #3b4556;background:#0a0c10;color:inherit}
    input{width:100%;box-sizing:border-box}
    button{background:#5b8cff;border:0;cursor:pointer;margin-top:18px}
    button:disabled{opacity:.5;cursor:not-allowed}
    progress{width:100%;margin-top:20px;height:12px}
    #status{white-space:pre-wrap;margin-top:18px;color:#b8c5d9}
    #status.failed{color:#ff9d9d}
    a{color:#8db3ff}
    .hint{color:#6f7c90;font-size:14px;margin-top:4px}
    #download{display:inline-block;margin-top:14px;padding:10px 16px;background:#2f9e5f;border-radius:7px;
              color:#fff;text-decoration:none;font-weight:600}
  </style>
</head>
<body><main>
  <h1>Recap English &rarr; Myanmar</h1>
  <p>Upload a video, then wait for the asynchronous AWS job to finish.</p>

  <label for="api">API address</label>
  <input id="api" placeholder="leave empty to use this page's own origin">
  <div class="hint">Only the public API URL goes here. AWS keys never belong in a browser.</div>

  <label for="file">Video or audio</label>
  <input id="file" type="file" accept="video/*,audio/*">

  <label for="voice">Myanmar voice</label>
  <input id="voice" value="my-MM-ThihaNeural">

  <button id="start">Upload and start</button>
  <progress id="progress" hidden></progress>
  <div id="status"></div>
  <div id="result"></div>

<script>
// The API base can come from ?api=..., from localStorage, or from a
// window.RECAP_API_BASE set by whatever serves this page. Nothing secret here.
const params = new URLSearchParams(location.search);
const apiInput = document.querySelector('#api');
apiInput.value = params.get('api') || localStorage.getItem('recapApiBase') || window.RECAP_API_BASE || '';
apiInput.onchange = () => localStorage.setItem('recapApiBase', apiInput.value.trim());
const apiBase = () => (apiInput.value || '').trim().replace(/\/+$/, '');

const file = document.querySelector('#file'), voice = document.querySelector('#voice');
const start = document.querySelector('#start'), status = document.querySelector('#status');
const progress = document.querySelector('#progress'), result = document.querySelector('#result');
const POLL_MS = 5000, MAX_POLLS = 720;   // up to an hour

const show = value => {
  status.classList.remove('failed');
  status.textContent = typeof value === 'string' ? value : JSON.stringify(value, null, 2);
};
const fail = message => { status.classList.add('failed'); status.textContent = message; };

async function call(path, options = {}) {
  const response = await fetch(apiBase() + path, options);
  let data = {};
  try { data = await response.json(); } catch (_) { /* a proxy may answer with HTML */ }
  if (!response.ok) throw new Error(data.detail || `${response.status} ${response.statusText}`);
  return data;
}

// XHR instead of fetch so the S3 upload can show real progress.
function uploadToS3(upload, blob) {
  return new Promise((resolve, reject) => {
    const form = new FormData();
    for (const [key, value] of Object.entries(upload.upload_fields || {})) form.append(key, value);
    form.append('file', blob);            // "file" must be the last field of an S3 POST
    const request = new XMLHttpRequest();
    request.open('POST', upload.upload_url, true);
    request.upload.onprogress = event => {
      if (event.lengthComputable) { progress.max = 100; progress.value = Math.round(event.loaded / event.total * 100); }
    };
    request.onload = () => (request.status >= 200 && request.status < 300)
      ? resolve() : reject(new Error(`S3 upload failed (${request.status}) ${request.responseText.slice(0, 200)}`));
    request.onerror = () => reject(new Error('the upload to S3 did not reach the server'));
    request.send(form);
  });
}

start.onclick = async () => {
  const chosen = file.files[0];
  result.innerHTML = '';
  if (!chosen) return fail('Choose a video or audio file first.');
  start.disabled = true; progress.hidden = false; progress.removeAttribute('value');
  try {
    show('Creating secure upload URL…');
    const upload = await call('/v1/uploads', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({
        filename: chosen.name,
        content_type: chosen.type || 'application/octet-stream',
        size_bytes: chosen.size,
        voice: voice.value,
      }),
    });
    if (chosen.size > upload.max_bytes) throw new Error(`that file is bigger than the ${upload.max_bytes} byte limit`);

    show('Uploading to S3…');
    await uploadToS3(upload, chosen);

    show('Starting processing…');
    const job = await call('/v1/jobs', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ job_id: upload.job_id, voice: voice.value }),
    });
    show({ ...job, note: 'waiting for a worker…' });

    for (let poll = 0; poll < MAX_POLLS; poll += 1) {
      await new Promise(wait => setTimeout(wait, POLL_MS));
      const state = await call('/v1/jobs/' + encodeURIComponent(upload.job_id));
      show(state);
      if (state.state === 'completed') {
        const url = state.output_url
          || (await call('/v1/jobs/' + encodeURIComponent(upload.job_id) + '/output')).output_url;
        result.innerHTML = '';
        const link = document.createElement('a');
        link.id = 'download'; link.href = url; link.textContent = 'Download the Myanmar video';
        result.appendChild(link);
        progress.value = 100;
        return;
      }
      if (state.state === 'failed') {
        progress.hidden = true;
        return fail(`the job failed during ${state.stage || 'processing'}: ${state.error || 'no detail'}`);
      }
    }
    fail('the job is still running after an hour; check it again with its job id: ' + upload.job_id);
  } catch (error) {
    progress.hidden = true;
    fail('Error: ' + error.message);
  } finally {
    start.disabled = false;
  }
};
</script>
</main></body></html>
